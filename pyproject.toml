[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finscope-ai-research"
version = "1.0.0"
description = "Finscope: a modular, reproducible financial-research workbench — ingestion, diagnostics, a forecasting study, portfolio construction, risk reporting and an evidence-first research brief (educational capstone; not investment advice)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aydin Monavvari" }]
keywords = [
  "financial-research",
  "reproducibility",
  "forecasting-evaluation",
  "portfolio-optimization",
  "value-at-risk",
  "research-workbench",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "yfinance>=0.2.40",
  "vaderSentiment>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# matplotlib.use("Agg") must precede the pyplot import in the figures module.
"src/finscope/reporting/figures.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
